# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 70b2fef1-9217-417f-918c-86acba532eb3
  title: CSC311 - Computer Systems and Programming Tools
  description: course website and syllabus for fall 2025
  # keywords: []
  authors: [Sarah M. Brown]
  github: https://github.com/compsys-progtools/spring2026
  # To autogenerate a Table of Contents, run "myst init --write-toc"
  exclude:
    - README.md
    - LICENSE
    - _worksheets/
    - _practice/
    - _prepare/
    - _review/
    - _static/
  toc:
    # Auto-generated by `myst init --write-toc`
    - file: index.md
    - title: Syllabus
      children:
        - file: syllabus/about.md
        - file: syllabus/tools.md
        - file: syllabus/grading.md
        - file: syllabus/badges.md
        - file: syllabus/badge_calc.md
        - file: syllabus/schedule.md
        - file: syllabus/uri_resources.md
        - file: syllabus/uri_statements.md
        - file: syllabus/communication.md
    - title: Notes
      children:
        - pattern: 'notes/2025-*.md'
    - title: Activities
      children:
        - file: activities/kwl.md
        - file: activities/community.md
        - file: activities/review.md
        - file: activities/prepare.md
        - file: activities/practice.md
        - file: activities/explore.md
        - file: activities/buildbadge.md
    - title: FAQ
      children:
        - file: faq/syllabus.md
        - file: faq/github.md
        - file: faq/tools.md
    - title: Resources
      children:
        - file: resources/glossary.md
        - file: resources/tips.md
        - file: resources/learning.md
        - file: resources/github.md
        - file: resources/languages.md
        - file: resources/gettinghelp.md
        - file: resources/organization.md
        - file: resources/more_info_on_cpus.md
        - file: resources/windows.md
    - file: genindex.md
  abbreviations:
    - CPU: Central Processing Unit
    - IDE: Integrated Development Environment
    - URI: University of Rhode Island
    - TA: Teaching Assistant
    - PR: Pull Request 
    - ACM: Association for Computing Machinery
  numbering:
    code: true
    math: false
    headings: false
  references:
    pyglossary:  https://docs.python.org/3/
site:
  template: book-theme
  options:
      folders: true
      logo: systools.png
      favicon: systools-fav.ico
